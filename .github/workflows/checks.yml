name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check app tests scripts
      - run: python scripts/check_ui_style.py
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run build
      - run: test -z "$(git status --porcelain -- app/static)"
      - run: python scripts/publication_guard.py --history
      - run: pip install pip-audit && pip-audit -r requirements-lock.txt
      - run: pnpm --dir frontend audit --audit-level low
